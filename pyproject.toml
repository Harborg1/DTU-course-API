[project]
name = "dtu-course-api"
version = "1.0.0"
description = "Searchable official DTU course catalogue API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "SQLAlchemy>=2.0,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "openai>=1.0,<2",
    "langdetect>=1.0.9,<2",
    "mcp>=2,<3",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
