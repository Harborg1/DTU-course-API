services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dtu_courses
      POSTGRES_USER: dtu
      POSTGRES_PASSWORD: dtu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtu -d dtu_courses"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://dtu:dtu@postgres:5432/dtu_courses
      API_KEY: ${API_KEY:-development-only-key}
      DTU_BASE_URL: https://kurser.dtu.dk
      DEFAULT_ACADEMIC_YEAR: 2026-2027
      IMPORT_REQUEST_DELAY: ${IMPORT_REQUEST_DELAY:-0.5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

volumes:
  postgres_data:

